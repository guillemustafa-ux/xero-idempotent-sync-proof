[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xero-idempotent-sync-proof"
version = "0.1.0"
description = "Runnable proof that a CRM -> Xero sync can be made exactly-once across crashes, with a fake Xero that encodes the documented behaviours"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# No runtime dependencies on purpose: the fake Xero, the transport, the OAuth
# client and the ledger are all standard library, so the proof is verifiable
# with pytest alone and nothing here can be blamed on a framework.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
# Flat layout: name the package explicitly so `tests/` and `scripts/` are
# never picked up as packages.
packages = ["xero_idempotent_sync_proof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli_format = "%(message)s"
addopts = "-q"
